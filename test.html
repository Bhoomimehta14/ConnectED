    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A1628 0%, #1A2332 100%);

            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);

            padding: 12px 24px;
            border-radius: 12px;
            display: inline-block;

        }
