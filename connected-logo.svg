<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Navy Background -->
  <rect width="200" height="200" rx="40" fill="#0A1628"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="turquoiseGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="greenGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Interwoven Connection Symbol -->
  <g transform="translate(100, 100)">
    <!-- First Loop (Top-Left to Bottom-Right) -->
    <path d="M -35,-35 Q -35,0 0,0 T 35,35 Q 35,0 0,0 T -35,-35" 
          fill="none" 
          stroke="url(#tealGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          opacity="0.9"/>
    
    <!-- Second Loop (Top-Right to Bottom-Left) -->
    <path d="M 35,-35 Q 35,0 0,0 T -35,35 Q -35,0 0,0 T 35,-35" 
          fill="none" 
          stroke="url(#turquoiseGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          opacity="0.9"/>
    
    <!-- Center Connection Circle -->
    <circle cx="0" cy="0" r="12" fill="url(#greenGradient)" opacity="1"/>
    
    <!-- Outer Connection Points -->
    <circle cx="-35" cy="-35" r="6" fill="#14B8A6"/>
    <circle cx="35" cy="-35" r="6" fill="#06B6D4"/>
    <circle cx="-35" cy="35" r="6" fill="#06B6D4"/>
    <circle cx="35" cy="35" r="6" fill="#10B981"/>
  </g>
</svg>