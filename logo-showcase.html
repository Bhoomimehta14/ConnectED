<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectED Logo Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            background: linear-gradient(135deg, #0A1628 0%, #1A2332 100%);
            color: white;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #14B8A6, #06B6D4, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 3rem;
            font-size: 1.2rem;
        }

        .logo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .logo-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .logo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(20, 184, 166, 0.3);
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            height: 200px;
        }

        .logo-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 15px;
        }

        .main-logo {
            text-align: center;
            margin-bottom: 60px;
        }

        .main-logo svg {
            filter: drop-shadow(0 20px 40px rgba(20, 184, 166, 0.4));
        }

        .usage-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .usage-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: #14B8A6;
        }

        .app-mockup {
            display: flex;
            gap: 40px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .phone-mockup {
            width: 300px;
            height: 600px;
            background: #000;
            border-radius: 30px;
            padding: 10px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .phone-screen {
            width: 100%;
            height: 100%;
            background: #0A1628;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .app-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .app-tagline {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        /* Alternative Logo Designs */
        .alt-logo {
            width: 100px;
            height: 100px;
        }

        /* Logo with text */
        .logo-with-text {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-text {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #14B8A6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ConnectED</h1>
        <p class="subtitle">Modern Educational Networking Platform</p>

        <!-- Main Logo Display -->
        <div class="main-logo">
            <svg width="300" height="300" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Dark Navy Background -->
                <rect width="200" height="200" rx="40" fill="#0A1628"/>
                
                <!-- Gradient Definitions -->
                <defs>
                    <linearGradient id="tealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="turquoiseGradient" x1="100%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
                    </linearGradient>
                    
                    <linearGradient id="greenGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
                    </linearGradient>
                </defs>
                
                <!-- Interwoven Connection Symbol -->
                <g transform="translate(100, 100)">
                    <!-- First Loop (Top-Left to Bottom-Right) -->
                    <path d="M -35,-35 Q -35,0 0,0 T 35,35 Q 35,0 0,0 T -35,-35" 
                          fill="none" 
                          stroke="url(#tealGradient)" 
                          stroke-width="8" 
                          stroke-linecap="round"
                          opacity="0.9"/>
                    
                    <!-- Second Loop (Top-Right to Bottom-Left) -->
                    <path d="M 35,-35 Q 35,0 0,0 T -35,35 Q -35,0 0,0 T 35,-35" 
                          fill="none" 
                          stroke="url(#turquoiseGradient)" 
                          stroke-width="8" 
                          stroke-linecap="round"
                          opacity="0.9"/>
                    
                    <!-- Center Connection Circle -->
                    <circle cx="0" cy="0" r="12" fill="url(#greenGradient)" opacity="1"/>
                    
                    <!-- Outer Connection Points -->
                    <circle cx="-35" cy="-35" r="6" fill="#14B8A6"/>
                    <circle cx="35" cy="-35" r="6" fill="#06B6D4"/>
                    <circle cx="-35" cy="35" r="6" fill="#06B6D4"/>
                    <circle cx="35" cy="35" r="6" fill="#10B981"/>
                </g>
            </svg>
        </div>

        <!-- Logo Variations -->
        <div class="logo-grid">
            <!-- On Dark Background -->
            <div class="logo-card">
                <div class="logo-container" style="background: #0A1628; border-radius: 20px;">
                    <img src="connected-logo.svg" alt="Logo on Dark" style="width: 150px;">
                </div>
                <div class="logo-label">On Dark Background</div>
            </div>

            <!-- On Light Background -->
            <div class="logo-card">
                <div class="logo-container" style="background: white; border-radius: 20px;">
                    <svg width="150" height="150" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(100, 100)">
                            <path d="M -35,-35 Q -35,0 0,0 T 35,35 Q 35,0 0,0 T -35,-35" 
                                  fill="none" stroke="#14B8A6" stroke-width="8" stroke-linecap="round"/>
                            <path d="M 35,-35 Q 35,0 0,0 T -35,35 Q -35,0 0,0 T 35,-35" 
                                  fill="none" stroke="#06B6D4" stroke-width="8" stroke-linecap="round"/>
                            <circle cx="0" cy="0" r="12" fill="#10B981"/>
                            <circle cx="-35" cy="-35" r="6" fill="#14B8A6"/>
                            <circle cx="35" cy="-35" r="6" fill="#06B6D4"/>
                            <circle cx="-35" cy="35" r="6" fill="#06B6D4"/>
                            <circle cx="35" cy="35" r="6" fill="#10B981"/>
                        </g>
                    </svg>
                </div>
                <div class="logo-label">On Light Background</div>
            </div>

            <!-- With Brand Name -->
            <div class="logo-card">
                <div class="logo-container">
                    <div class="logo-with-text">
                        <svg width="60" height="60" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                            <rect width="200" height="200" rx="40" fill="#0A1628"/>
                            <g transform="translate(100, 100)">
                                <path d="M -35,-35 Q -35,0 0,0 T 35,35 Q 35,0 0,0 T -35,-35" 
                                      fill="none" stroke="#14B8A6" stroke-width="8" stroke-linecap="round"/>
                                <path d="M 35,-35 Q 35,0 0,0 T -35,35 Q -35,0 0,0 T 35,-35" 
                                      fill="none" stroke="#06B6D4" stroke-width="8" stroke-linecap="round"/>
                                <circle cx="0" cy="0" r="12" fill="#10B981"/>
                                <circle cx="-35" cy="-35" r="6" fill="#14B8A6"/>
                                <circle cx="35" cy="-35" r="6" fill="#06B6D4"/>
                                <circle cx="-35" cy="35" r="6" fill="#06B6D4"/>
                                <circle cx="35" cy="35" r="6" fill="#10B981"/>
                            </g>
                        </svg>
                        <span class="brand-text">ConnectED</span>
                    </div>
                </div>
                <div class="logo-label">With Brand Name</div>
            </div>

            <!-- Monochrome Version -->
            <div class="logo-card">
                <div class="logo-container" style="background: #1a1a1a; border-radius: 20px;">
                    <svg width="150" height="150" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                        <g transform="translate(100, 100)">
                            <path d="M -35,-35 Q -35,0 0,0 T 35,35 Q 35,0 0,0 T -35,-35" 
                                  fill="none" stroke="#14B8A6" stroke-width="8" stroke-linecap="round" opacity="1"/>
                            <path d="M 35,-35 Q 35,0 0,0 T -35,35 Q -35,0 0,0 T 35,-35" 
                                  fill="none" stroke="#14B8A6" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
                            <circle cx="0" cy="0" r="12" fill="#14B8A6"/>
                            <circle cx="-35" cy="-35" r="6" fill="#14B8A6" opacity="0.8"/>
                            <circle cx="35" cy="-35" r="6" fill="#14B8A6" opacity="0.8"/>
                            <circle cx="-35" cy="35" r="6" fill="#14B8A6" opacity="0.8"/>
                            <circle cx="35" cy="35" r="6" fill="#14B8A6" opacity="0.8"/>
                        </g>
                    </svg>
                </div>
                <div class="logo-label">Monochrome Version</div>
            </div>
        </div>

        <!-- Usage Examples -->
        <div class="usage-section">
            <h2 class="usage-title">App Icon Usage</h2>
            <div class="app-mockup">
                <!-- Phone Mockup -->
                <div class="phone-mockup">
                    <div class="phone-screen">
                        <div class="app-icon">
                            <img src="connected-logo.svg" alt="App Icon" style="width: 100%; height: 100%;">
                        </div>
                        <div class="app-name">ConnectED</div>
                        <div class="app-tagline">Connect • Collaborate • Create</div>
                    </div>
                </div>

                <!-- Icon Grid -->
                <div style="display: grid; grid-template-columns: repeat(3, 80px); gap: 20px;">
                    <div style="text-align: center;">
                        <div style="width: 80px; height: 80px; border-radius: 18px; overflow: hidden; margin-bottom: 8px;">
                            <img src="connected-logo.svg" alt="iOS Icon" style="width: 100%;">
                        </div>
                        <small style="color: rgba(255,255,255,0.5)">iOS</small>
                    </div>
                    <div style="text-align: center;">
                        <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; margin-bottom: 8px;">
                            <img src="connected-logo.svg" alt="Android Icon" style="width: 100%;">
                        </div>
                        <small style="color: rgba(255,255,255,0.5)">Android</small>
                    </div>
                    <div style="text-align: center;">
                        <div style="width: 80px; height: 80px; border-radius: 12px; overflow: hidden; margin-bottom: 8px;">
                            <img src="connected-logo.svg" alt="Web Icon" style="width: 100%;">
                        </div>
                        <small style="color: rgba(255,255,255,0.5)">Web</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Color Palette -->
        <div class="usage-section">
            <h2 class="usage-title">Brand Colors</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
                <div style="text-align: center;">
                    <div style="width: 100px; height: 100px; background: #14B8A6; border-radius: 12px; margin-bottom: 10px;"></div>
                    <div style="font-weight: 600;">Teal</div>
                    <div style="color: rgba(255,255,255,0.5); font-size: 14px;">#14B8A6</div>
                </div>
                <div style="text-align: center;">
                    <div style="width: 100px; height: 100px; background: #06B6D4; border-radius: 12px; margin-bottom: 10px;"></div>
                    <div style="font-weight: 600;">Turquoise</div>
                    <div style="color: rgba(255,255,255,0.5); font-size: 14px;">#06B6D4</div>
                </div>
                <div style="text-align: center;">
                    <div style="width: 100px; height: 100px; background: #10B981; border-radius: 12px; margin-bottom: 10px;"></div>
                    <div style="font-weight: 600;">Green</div>
                    <div style="color: rgba(255,255,255,0.5); font-size: 14px;">#10B981</div>
                </div>
                <div style="text-align: center;">
                    <div style="width: 100px; height: 100px; background: #0A1628; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.2);"></div>
                    <div style="font-weight: 600;">Navy</div>
                    <div style="color: rgba(255,255,255,0.5); font-size: 14px;">#0A1628</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
