<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="66%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Navy Background -->
  <rect width="200" height="200" rx="40" fill="#0A1628"/>
  
  <!-- Interwoven Infinity-Style Logo -->
  <g transform="translate(100, 100)">
    <!-- Main Interwoven Path -->
    <path d="M -35,0 
             C -35,-25 -25,-35 0,-35
             C 25,-35 35,-25 35,0
             C 35,25 25,35 0,35
             C -25,35 -35,25 -35,0
             Z
             M 0,-20
             C -15,-20 -20,-15 -20,0
             C -20,15 -15,20 0,20
             C 15,20 20,15 20,0
             C 20,-15 15,-20 0,-20
             Z" 
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)"
          transform="rotate(45)"/>
    
    <!-- Second Interwoven Path -->
    <path d="M -35,0 
             C -35,-25 -25,-35 0,-35
             C 25,-35 35,-25 35,0
             C 35,25 25,35 0,35
             C -25,35 -35,25 -35,0
             Z
             M 0,-20
             C -15,-20 -20,-15 -20,0
             C -20,15 -15,20 0,20
             C 15,20 20,15 20,0
             C 20,-15 15,-20 0,-20
             Z" 
          fill="none" 
          stroke="url(#mainGradient)" 
          stroke-width="8" 
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)"
          transform="rotate(-45)"/>
    
    <!-- Center Connection Point -->
    <circle cx="0" cy="0" r="10" fill="url(#mainGradient)" filter="url(#shadow)"/>
  </g>
</svg>