<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectED - Profile Setup</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #3B82F6;
            --primary-purple: #7C3AED;
            --secondary-turquoise: #06B6D4;
            --secondary-coral: #F87171;
            --accent-yellow: #FACC15;
            --bg-dark: #0F0F0F;
            --bg-gray: #1E1E1E;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: var(--bg-dark);
            color: white;
            padding: 20px;
        }

        /* Background */
        .background {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-gray));
            z-index: -1;
        }

        .floating-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            background: var(--primary-blue);
            top: -100px;
            left: -100px;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: var(--primary-purple);
            bottom: -200px;
            right: -200px;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Main Container */
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Profile Card */
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 24px;
            animation: slideUp 0.8s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Elements */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-field {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        select.input-field {
            cursor: pointer;
        }

        select.input-field option {
            background: var(--bg-gray);
            color: white;
        }

        /* Skills & Interests Selection */
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .selection-item {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .selection-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .selection-item.selected {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border-color: transparent;
            animation: selectPop 0.3s ease;
        }

        @keyframes selectPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .selection-item .icon {
            font-size: 24px;
            margin-bottom: 4px;
            display: block;
        }

        /* Profile Summary */
        .profile-summary {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px;
            animation: slideUp 0.8s ease 0.2s both;
        }

        .summary-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }

        .user-info h2 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .user-info p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        /* Tags Display */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .tag {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .tag.skill {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .tag.interest {
            background: rgba(124, 58, 237, 0.2);
            border: 1px solid rgba(124, 58, 237, 0.3);
        }

        /* Animation for notifications */
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* XP Display */
        .xp-display {
            margin-top: 24px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        .xp-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .xp-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-progress {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* Save Button */
        .save-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .save-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .save-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.4);
        }

        .save-button:active {
            transform: translateY(0);
        }

        /* Success Message */
        .success-message {
            display: none;
            padding: 12px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            border-radius: 12px;
            color: #22C55E;
            text-align: center;
            margin-top: 20px;
            animation: slideUp 0.3s ease;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="floating-orb orb1"></div>
    <div class="floating-orb orb2"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">
                <svg width="48" height="48" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <rect width="200" height="200" rx="40" fill="#0A1628"/>
                    <defs>
                        <linearGradient id="tealGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="turquoiseGradient2" x1="100%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
                        </linearGradient>
                        <linearGradient id="greenGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#14B8A6;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <g transform="translate(100, 100)">
                        <path d="M -35,-35 Q -35,0 0,0 T 35,35 Q 35,0 0,0 T -35,-35" fill="none" stroke="url(#tealGradient2)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
                        <path d="M 35,-35 Q 35,0 0,0 T -35,35 Q -35,0 0,0 T 35,-35" fill="none" stroke="url(#turquoiseGradient2)" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
                        <circle cx="0" cy="0" r="12" fill="url(#greenGradient2)" opacity="1"/>
                        <circle cx="-35" cy="-35" r="6" fill="#14B8A6"/>
                        <circle cx="35" cy="-35" r="6" fill="#06B6D4"/>
                        <circle cx="-35" cy="35" r="6" fill="#06B6D4"/>
                        <circle cx="35" cy="35" r="6" fill="#10B981"/>
                    </g>
                </svg>
            </div>
            <div class="logo-text">ConnectED</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Profile Setup Card -->
        <div class="profile-card">
            <h2 class="section-title">
                <span>👤</span>
                <span>Complete Your Profile</span>
            </h2>

            <form id="profileForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" class="input-field" placeholder="Enter your first name" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" class="input-field" placeholder="Enter your last name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="course">Course</label>
                        <select id="course" class="input-field" required>
                            <option value="">Select your course</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Business">Business</option>
                            <option value="Design">Design</option>
                            <option value="Arts">Arts</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="year">Year</label>
                        <select id="year" class="input-field" required>
                            <option value="">Select your year</option>
                            <option value="1st Year">1st Year</option>
                            <option value="2nd Year">2nd Year</option>
                            <option value="3rd Year">3rd Year</option>
                            <option value="4th Year">4th Year</option>
                            <option value="Graduate">Graduate</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" class="input-field" min="16" max="50" placeholder="Your age" required>
                    </div>
                    <div class="form-group">
                        <label for="bio">Short Bio (Optional)</label>
                        <input type="text" id="bio" class="input-field" placeholder="Tell us about yourself...">
                    </div>
                </div>

                <!-- Skills Selection -->
                <div class="form-group full-width">
                    <label>Select Your Skills</label>
                    <div style="margin-bottom: 16px;">
                        <input 
                            type="text" 
                            id="customSkill" 
                            placeholder="Add custom skill (e.g., Machine Learning, Video Editing)"
                            style="width: calc(100% - 120px); padding: 12px; background: rgba(255, 255, 255, 0.05); 
                                   border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white;
                                   font-size: 14px; margin-right: 10px;"
                        />
                        <button 
                            type="button"
                            onclick="addCustomSkill(event)" 
                            style="padding: 12px 20px; background: linear-gradient(135deg, #3B82F6, #7C3AED);
                                   border: none; border-radius: 12px; color: white; cursor: pointer;
                                   font-weight: 600; transition: all 0.3s ease;"
                        >
                            Add +
                        </button>
                    </div>
                    <div class="selection-grid" id="skillsGrid">
                        <div class="selection-item" data-skill="Coding">
                            <span class="icon">💻</span>
                            <span>Coding</span>
                        </div>
                        <div class="selection-item" data-skill="Design">
                            <span class="icon">🎨</span>
                            <span>Design</span>
                        </div>
                        <div class="selection-item" data-skill="Writing">
                            <span class="icon">✍️</span>
                            <span>Writing</span>
                        </div>
                        <div class="selection-item" data-skill="Speaking">
                            <span class="icon">🎤</span>
                            <span>Speaking</span>
                        </div>
                        <div class="selection-item" data-skill="Leadership">
                            <span class="icon">👥</span>
                            <span>Leadership</span>
                        </div>
                        <div class="selection-item" data-skill="Analytics">
                            <span class="icon">📊</span>
                            <span>Analytics</span>
                        </div>
                        <div class="selection-item" data-skill="Marketing">
                            <span class="icon">📢</span>
                            <span>Marketing</span>
                        </div>
                        <div class="selection-item" data-skill="Photography">
                            <span class="icon">📸</span>
                            <span>Photography</span>
                        </div>
                    </div>
                </div>

                <!-- Interests Selection -->
                <div class="form-group full-width">
                    <label>Select Your Interests</label>
                    <div style="margin-bottom: 16px;">
                        <input 
                            type="text" 
                            id="customInterest" 
                            placeholder="Add custom interest (e.g., Blockchain, Photography, Dance)"
                            onkeypress="if(event.key === 'Enter') { event.preventDefault(); addCustomInterest(); }"
                            style="width: calc(100% - 120px); padding: 12px; background: rgba(255, 255, 255, 0.05); 
                                   border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white;
                                   font-size: 14px; margin-right: 10px;"
                        />
                        <button 
                            type="button"
                            onclick="addCustomInterest(event)" 
                            style="padding: 12px 20px; background: linear-gradient(135deg, #3B82F6, #7C3AED);
                                   border: none; border-radius: 12px; color: white; cursor: pointer;
                                   font-weight: 600; transition: all 0.3s ease;"
                        >
                            Add +
                        </button>
                    </div>
                    <div class="selection-grid" id="interestsGrid">
                        <div class="selection-item" data-interest="Technology">
                            <span class="icon">🚀</span>
                            <span>Technology</span>
                        </div>
                        <div class="selection-item" data-interest="Sports">
                            <span class="icon">⚽</span>
                            <span>Sports</span>
                        </div>
                        <div class="selection-item" data-interest="Music">
                            <span class="icon">🎵</span>
                            <span>Music</span>
                        </div>
                        <div class="selection-item" data-interest="Arts">
                            <span class="icon">🎭</span>
                            <span>Arts</span>
                        </div>
                        <div class="selection-item" data-interest="Gaming">
                            <span class="icon">🎮</span>
                            <span>Gaming</span>
                        </div>
                        <div class="selection-item" data-interest="Reading">
                            <span class="icon">📚</span>
                            <span>Reading</span>
                        </div>
                        <div class="selection-item" data-interest="Travel">
                            <span class="icon">✈️</span>
                            <span>Travel</span>
                        </div>
                        <div class="selection-item" data-interest="Food">
                            <span class="icon">🍕</span>
                            <span>Food</span>
                        </div>
                    </div>
                </div>

                <button type="submit" class="save-button">Continue to Profile</button>
            </form>

            <div class="success-message" id="successMessage">
                ✅ Profile saved successfully! +50 XP earned
            </div>
        </div>

    </div>

    <script>
        // Show notification function
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #14B8A6, #06B6D4);
                color: white;
                padding: 12px 20px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(20, 184, 166, 0.3);
                z-index: 1000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Selected skills and interests
        let selectedSkills = [];
        let selectedInterests = [];

        // Handle skill selection
        document.querySelectorAll('#skillsGrid .selection-item').forEach(item => {
            item.addEventListener('click', function() {
                const skill = this.dataset.skill;
                
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    selectedSkills = selectedSkills.filter(s => s !== skill);
                } else {
                    this.classList.add('selected');
                    selectedSkills.push(skill);
                }
                
                console.log('Selected skills:', selectedSkills);
            });
        });

        // Handle interest selection
        document.querySelectorAll('#interestsGrid .selection-item').forEach(item => {
            item.addEventListener('click', function() {
                const interest = this.dataset.interest;
                
                if (this.classList.contains('selected')) {
                    this.classList.remove('selected');
                    selectedInterests = selectedInterests.filter(i => i !== interest);
                } else {
                    this.classList.add('selected');
                    selectedInterests.push(interest);
                }
                
                console.log('Selected interests:', selectedInterests);
            });
        });

        // Add custom skill
        function addCustomSkill() {
            const input = document.getElementById('customSkill');
            const skill = input.value.trim();
            
            if (skill && !selectedSkills.includes(skill)) {
                // Add to selected skills
                selectedSkills.push(skill);
                
                // Create new skill element
                const skillsGrid = document.getElementById('skillsGrid');
                const newSkillDiv = document.createElement('div');
                newSkillDiv.className = 'selection-item selected';
                newSkillDiv.setAttribute('data-skill', skill);
                newSkillDiv.innerHTML = `
                    <span class="icon">✨</span>
                    <span>${skill}</span>
                `;
                newSkillDiv.addEventListener('click', function() {
                    const skill = this.dataset.skill;
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        selectedSkills = selectedSkills.filter(s => s !== skill);
                    } else {
                        this.classList.add('selected');
                        selectedSkills.push(skill);
                    }
                });
                
                // Add to beginning of grid
                skillsGrid.insertBefore(newSkillDiv, skillsGrid.firstChild);
                
                // Clear input
                input.value = '';
                
                // Show confirmation
                showNotification(`Added custom skill: ${skill}`);
            }
        }

        // Add custom interest
        function addCustomInterest() {
            const input = document.getElementById('customInterest');
            const interest = input.value.trim();
            
            if (interest && !selectedInterests.includes(interest)) {
                // Add to selected interests
                selectedInterests.push(interest);
                
                // Create new interest element
                const interestsGrid = document.getElementById('interestsGrid');
                const newInterestDiv = document.createElement('div');
                newInterestDiv.className = 'selection-item selected';
                newInterestDiv.setAttribute('data-interest', interest);
                newInterestDiv.innerHTML = `
                    <span class="icon">🌟</span>
                    <span>${interest}</span>
                `;
                newInterestDiv.addEventListener('click', function() {
                    const interest = this.dataset.interest;
                    if (this.classList.contains('selected')) {
                        this.classList.remove('selected');
                        selectedInterests = selectedInterests.filter(i => i !== interest);
                    } else {
                        this.classList.add('selected');
                        selectedInterests.push(interest);
                    }
                });
                
                // Add to beginning of grid
                interestsGrid.insertBefore(newInterestDiv, interestsGrid.firstChild);
                
                // Clear input
                input.value = '';
                
                // Show confirmation
                showNotification(`Added custom interest: ${interest}`);
            }
        }

        // Handle form submission
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Get form values
            const profileData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                course: document.getElementById('course').value,
                year: document.getElementById('year').value,
                age: document.getElementById('age').value,
                bio: document.getElementById('bio').value,
                skills: selectedSkills,
                interests: selectedInterests,
                xp: 50,
                level: 1,
                createdAt: new Date().toISOString()
            };
            
            // Save to localStorage
            localStorage.setItem('userProfile', JSON.stringify(profileData));
            
            // Update existing session if exists
            const session = JSON.parse(localStorage.getItem('currentSession') || '{}');
            if (session.user) {
                session.user = { ...session.user, ...profileData };
                localStorage.setItem('currentSession', JSON.stringify(session));
            }
            
            // Show success message
            document.getElementById('successMessage').classList.add('show');
            
            console.log('✅ Profile saved:', profileData);
            
            // Redirect to profile page after delay
            setTimeout(() => {
                window.location.href = 'connected-profile.html';
            }, 1500);
        });

    </script>
