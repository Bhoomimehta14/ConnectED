<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark Navy Background Circle -->
  <circle cx="100" cy="100" r="90" fill="#0A1628"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <!-- Teal to Turquoise Gradient -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Turquoise to Green Gradient -->
    <linearGradient id="gradient2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Mixed Gradient -->
    <linearGradient id="gradient3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Interwoven Geometric Knot Design -->
  <g transform="translate(100, 100)">
    <!-- First Ring (Top-Left to Bottom-Right) -->
    <path d="M -40,-40 
             C -40,-20 -20,-20 -20,0
             C -20,20 0,20 20,20
             C 40,20 40,40 40,40
             C 40,40 20,40 0,40
             C -20,40 -40,20 -40,0
             C -40,-20 -20,-40 0,-40
             C 20,-40 40,-20 40,0
             C 40,20 20,20 20,20" 
          fill="none" 
          stroke="url(#gradient1)" 
          stroke-width="12" 
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
    
    <!-- Second Ring (Top-Right to Bottom-Left) -->
    <path d="M 40,-40 
             C 40,-20 20,-20 20,0
             C 20,20 0,20 -20,20
             C -40,20 -40,40 -40,40
             C -40,40 -20,40 0,40
             C 20,40 40,20 40,0
             C 40,-20 20,-40 0,-40
             C -20,-40 -40,-20 -40,0
             C -40,20 -20,20 -20,20" 
          fill="none" 
          stroke="url(#gradient2)" 
          stroke-width="12" 
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.95"/>
    
    <!-- Center Connector Circle -->
    <circle cx="0" cy="0" r="15" fill="url(#gradient3)" opacity="1"/>
    
    <!-- Corner Nodes -->
    <circle cx="-40" cy="-40" r="8" fill="#14B8A6" opacity="0.9"/>
    <circle cx="40" cy="-40" r="8" fill="#06B6D4" opacity="0.9"/>
    <circle cx="-40" cy="40" r="8" fill="#06B6D4" opacity="0.9"/>
    <circle cx="40" cy="40" r="8" fill="#10B981" opacity="0.9"/>
  </g>
</svg>